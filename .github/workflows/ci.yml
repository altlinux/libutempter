name: CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  whitespace-errors:
    name: Check for whitespace errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check
        run: git diff-index --check --cached 4b825dc642cb6eb9a060e54bf8d69288fbee4904

  build-check:
    strategy:
      fail-fast: false
      matrix:
        cc:
          - gcc-14
          - gcc-13
          - gcc-12
          - gcc-11
          - gcc-10
          - gcc-9
          - clang-19
          - clang-18
          - clang-17
          - clang-16
          - clang-15
          - clang-14
          - musl-gcc
        target: [x86_64, x86]
        variant: [base, debug, log]
        exclude:
          - cc: musl-gcc
            target: x86
            variant: base
          - cc: musl-gcc
            target: x86
            variant: debug
          - cc: musl-gcc
            target: x86
            variant: log
    name: Build ${{ matrix.cc }}-${{ matrix.target }}-${{ matrix.variant }}
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.cc }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set environment variables
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          case "$VARIANT" in
            base) ;;
            debug)  echo 'CPPFLAGS=-DUTEMPTER_DEBUG' >> "$GITHUB_ENV" ;;
            log)    echo 'CPPFLAGS=-DUTEMPTER_LOG' >> "$GITHUB_ENV" ;;
            *)      echo "Unknown variant: $VARIANT" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: ci/install-dependencies.sh

      - name: Build check
        run: ci/run-build-and-tests.sh
